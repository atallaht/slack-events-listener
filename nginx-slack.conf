# The Slack Events listener runs in host network mode and binds to 0.0.0.0:3010.
# nginx proxies /slack/events to the host running the container on this port.
# Replace <LISTENER_HOST> with the container host IP or hostname.

location /slack/events {
    proxy_pass http://<LISTENER_HOST>:3010/slack/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /slack/health {
    proxy_pass http://<LISTENER_HOST>:3010/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
